    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OzyBridge" />
    <meta property="og:url" content="https://jchancoding.github.io/OzyBridge/" />
    <meta property="og:title" content="OzyBridge — Write EQ to your USB DAC from the browser" />
    <meta
      property="og:description"
      content="Drop a Squiglink, AutoEQ, or PeqDB EQ onto a slot and write it straight to your USB DAC. No format conversion, no account, no app."
    />
    <meta property="og:image" content="https://jchancoding.github.io/OzyBridge/og-image.png" />
    <meta property="og:image:width" content="1200" />

      name="twitter:description"
      content="Drop a Squiglink, AutoEQ, or PeqDB EQ onto a slot and write it straight to your USB DAC. No account, no app."
    />
    <meta name="twitter:image" content="https://jchancoding.github.io/OzyBridge/og-image.png" />
    <meta name="theme-color" content="#0E131A" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('ozy-theme');
          var d = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = d ? 'dark' : 'light';
          var m = localStorage.getItem('ozy-motion');
          document.documentElement.dataset.motion = m === 'on' || m === 'off' ? m : matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on';
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
